<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="1400" height="1200" viewBox="0 0 1400 1200">
  <title>2001 Nails of Woodbury — Inkscape Logo System</title>
  <rect width="1400" height="1200" fill="#f3eee5"/>
  <text x="60" y="74" fill="#b08b5b" font-family="Helvetica Neue" font-size="18" letter-spacing="5">CUSTOM VECTOR LOGO SYSTEM</text>
  <text x="60" y="118" fill="#302d28" font-family="Helvetica Neue" font-size="34" font-weight="600">2001 Nails of Woodbury</text>

  <rect x="50" y="160" width="850" height="990" rx="28" fill="#fffaf2" stroke="#ded2c1"/>
  <text x="82" y="205" fill="#827768" font-family="Helvetica Neue" font-size="15" letter-spacing="2">PRIMARY</text>
  <image href="logo-primary.svg" x="75" y="210" width="800" height="850"/>

  <rect x="940" y="160" width="410" height="485" rx="28" fill="#fffaf2" stroke="#ded2c1"/>
  <text x="972" y="205" fill="#827768" font-family="Helvetica Neue" font-size="15" letter-spacing="2">FAVICON</text>
  <image href="logo-favicon.svg" x="985" y="225" width="320" height="320"/>

  <rect x="940" y="685" width="410" height="465" rx="28" fill="#fffaf2" stroke="#ded2c1"/>
  <text x="972" y="730" fill="#827768" font-family="Helvetica Neue" font-size="15" letter-spacing="2">TRANSITION</text>
  <image href="logo-transition.svg" x="970" y="780" width="350" height="197"/>
</svg>
